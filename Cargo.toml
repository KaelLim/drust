[package]
name = "drust"
version = "1.63.0"
edition = "2024"
rust-version = "1.93"
autotests = false

[[bin]]
name = "drust"
path = "src/main.rs"

[[bin]]
name = "drust_session_janitor"
path = "src/bin/drust_session_janitor.rs"

[[bin]]
name = "set_admin_role"
path = "src/bin/set_admin_role.rs"

[dependencies]
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "process"] }
axum               = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower-http         = { version = "0.6", features = ["trace", "cors", "set-header"] }
rmcp               = { version = "1.5", features = ["server", "transport-streamable-http-server", "transport-worker"] }
schemars           = "1"
tower              = { version = "0.5", features = ["util"] }
rusqlite           = { version = "0.40", features = ["bundled", "hooks", "preupdate_hook"] }
sqlite-vec         = "0.1"
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1", features = ["preserve_order"] }
askama             = "0.16"
argon2             = "0.5"
subtle             = "2"
sha2               = "0.10"
hmac               = "0.12"
base64             = "0.22"
rand               = "0.8"
uuid               = { version = "1", features = ["v4", "fast-rng"] }
dashmap            = "6"
nix                = { version = "0.29", features = ["fs"] }
chrono             = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml               = "0.8"
anyhow             = "1"
thiserror          = "2"
axum-extra         = { version = "0.12", features = ["cookie", "cookie-signed", "form"] }
cookie             = "0.18"
tokio-stream       = { version = "0.1", features = ["sync"] }
tokio-util         = { version = "0.7", features = ["io"] }
futures            = "0.3"
urlencoding        = "2"
url                = "2"
object_store       = { version = "0.13", features = ["aws"] }
mime_guess         = "2"
bytes              = "1"
reqwest            = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form"] }
pulldown-cmark     = { version = "0.13", default-features = false, features = ["html"] }
flate2             = { version = "1", default-features = false, features = ["rust_backend"] }
tar                = { version = "0.4", default-features = false }
zstd               = { version = "0.13", default-features = false }
tempfile           = "3"
prometheus         = { version = "0.14", default-features = false }
wasmtime           = { version = "46", default-features = false, features = ["runtime", "component-model", "async", "parallel-compilation", "cranelift", "anyhow"] }
wasmtime-wasi      = "46"
async-trait        = "0.1"
regex-lite         = "0.1"
croner = "3.0.1"

[dev-dependencies]
serial_test        = "3"
reqwest            = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
eventsource-stream = "0.2"
serde_urlencoded   = "0.7"
tokio-tungstenite  = "0.24"
futures-util       = "0.3"

[build-dependencies]
toml       = "0.8"
regex-lite = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Full debug info is this repo's single largest disk cost: every test binary
# statically links the lib plus wasmtime and carries ~176 MB of .debug_info.
# Measured 2026-08-02, when tests/*.rs was 229 separate binaries, that came to
# 55.9 GB of target/debug. #925 merges those into 32 targets (24 group
# harnesses + 8 isolation exceptions), which cuts the binary COUNT but not the
# per-binary cost — so this setting still earns its place.
# "line-tables-only" keeps file:line in panic backtraces — the part anyone
# actually reads — and drops the type and variable DWARF nobody steps through
# here. Override per-invocation when you need a real debugger:
# CARGO_PROFILE_DEV_DEBUG=2 cargo test --test <name>
[profile.dev]
debug = "line-tables-only"

[workspace]
members = ["cli"]
resolver = "2"

# --- Explicit test targets (#925) --------------------------------------------
# `autotests = false` (top of file) turns off cargo's tests/*.rs auto-discovery,
# so every test binary is listed below: the merged group harnesses
# (tests/g_<group>.rs, each `#[path]`-including its member files unchanged) plus
# the isolation exceptions that must keep a process to themselves. tests/
# helpers.rs is deliberately not a target — it declares zero #[test] fns and
# linking it as its own binary was pure waste.
#
# Forgetting an entry here would drop a whole suite with no error anywhere, so
# build.rs's ninth gate (build_support/test_targets_gate.rs) fails the build on
# any tests/*.rs that is neither a target here nor a `#[path]` member of one.
# Spec: docs/superpowers/specs/2026-08-13-test-binary-consolidation-design.md
[[test]]
name = "g_admin"
path = "tests/g_admin.rs"
[[test]]
# Isolation exceptions (#925 T2). Both assert on audit rows in an audit DB
# they install through the first-write-wins `audit_db::init_globals`
# OnceLock, and g_admin already has a third installer (admin_oauth, via
# common::oauth_helpers), so merged they read whichever file won the race.
name = "admin_pat_bearer"
path = "tests/admin_pat_bearer.rs"
[[test]]
name = "admin_pat_reroll"
path = "tests/admin_pat_reroll.rs"
[[test]]
name = "g_auth"
path = "tests/g_auth.rs"
[[test]]
name = "g_mcp"
path = "tests/g_mcp.rs"
[[test]]
name = "g_tenant"
path = "tests/g_tenant.rs"
[[test]]
# Isolation exception (#925 T2): asserts on audit rows in the DB it installs
# via the first-write-wins `audit_db::init_globals` OnceLock, which
# tenant_oauth (via common::oauth_helpers) also races for inside g_tenant.
name = "tenant_quota_requests"
path = "tests/tenant_quota_requests.rs"
