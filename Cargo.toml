[package]
name = "drust"
version = "1.66.0"
edition = "2024"
rust-version = "1.93"
autotests = false

[[bin]]
name = "drust"
path = "src/main.rs"

[[bin]]
name = "drust_session_janitor"
path = "src/bin/drust_session_janitor.rs"

[[bin]]
name = "set_admin_role"
path = "src/bin/set_admin_role.rs"

[dependencies]
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "process"] }
axum               = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower-http         = { version = "0.6", features = ["trace", "cors", "set-header"] }
rmcp               = { version = "1.5", features = ["server", "transport-streamable-http-server", "transport-worker"] }
schemars           = "1"
tower              = { version = "0.5", features = ["util"] }
rusqlite           = { version = "0.40", features = ["bundled", "hooks", "preupdate_hook"] }
sqlite-vec         = "0.1"
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1", features = ["preserve_order"] }
askama             = "0.16"
argon2             = "0.5"
subtle             = "2"
sha2               = "0.10"
hmac               = "0.12"
base64             = "0.22"
rand               = "0.8"
uuid               = { version = "1", features = ["v4", "fast-rng"] }
dashmap            = "6"
nix                = { version = "0.29", features = ["fs"] }
chrono             = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml               = "0.8"
anyhow             = "1"
thiserror          = "2"
axum-extra         = { version = "0.12", features = ["cookie", "cookie-signed", "form"] }
cookie             = "0.18"
tokio-stream       = { version = "0.1", features = ["sync"] }
tokio-util         = { version = "0.7", features = ["io"] }
futures            = "0.3"
urlencoding        = "2"
url                = "2"
object_store       = { version = "0.13", features = ["aws"] }
mime_guess         = "2"
bytes              = "1"
reqwest            = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form"] }
pulldown-cmark     = { version = "0.13", default-features = false, features = ["html"] }
flate2             = { version = "1", default-features = false, features = ["rust_backend"] }
tar                = { version = "0.4", default-features = false }
zstd               = { version = "0.13", default-features = false }
tempfile           = "3"
prometheus         = { version = "0.14", default-features = false }
wasmtime           = { version = "46", default-features = false, features = ["runtime", "component-model", "async", "parallel-compilation", "cranelift", "anyhow"] }
wasmtime-wasi      = "46"
async-trait        = "0.1"
regex-lite         = "0.1"
croner = "3.0.1"

[dev-dependencies]
serial_test        = "3"
reqwest            = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
eventsource-stream = "0.2"
serde_urlencoded   = "0.7"
tokio-tungstenite  = "0.24"
futures-util       = "0.3"

[build-dependencies]
toml       = "0.8"
regex-lite = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Full debug info is this repo's single largest disk cost: every test binary
# statically links the lib plus wasmtime and carries ~176 MB of .debug_info.
# Measured 2026-08-02, when tests/*.rs was 229 separate binaries, that came to
# 55.9 GB of target/debug. #925 merges those into 38 targets (24 group
# harnesses + 14 standalone), which cuts the binary COUNT but not the
# per-binary cost — so this setting still earns its place.
# "line-tables-only" keeps file:line in panic backtraces — the part anyone
# actually reads — and drops the type and variable DWARF nobody steps through
# here. Override per-invocation when you need a real debugger:
# CARGO_PROFILE_DEV_DEBUG=2 cargo test --test <name>
[profile.dev]
debug = "line-tables-only"

[workspace]
members = ["cli"]
resolver = "2"

# --- Explicit test targets (#925) --------------------------------------------
# `autotests = false` (top of file) turns off cargo's tests/*.rs auto-discovery,
# so every test binary is listed below: the merged group harnesses
# (tests/g_<group>.rs, each `#[path]`-including its member files unchanged) plus
# the 14 standalone targets that must keep a process to themselves — 8 isolation
# exceptions, plus 6 backed out of a harness on a merge collision (each one's
# reason is recorded below; a collision is resolved by backing the file out,
# never by editing the test). tests/helpers.rs is deliberately not a target — it
# declares zero #[test] fns and linking it as its own binary was pure waste.
#
# Forgetting an entry here would drop a whole suite with no error anywhere, so
# build.rs's ninth gate (build_support/test_targets_gate.rs) fails the build on
# any tests/*.rs that is neither a target here nor a `#[path]` member of one.
# Spec: docs/superpowers/specs/2026-08-13-test-binary-consolidation-design.md
[[test]]
name = "g_admin"
path = "tests/g_admin.rs"
[[test]]
# Isolation exceptions (#925 T2). Both assert on audit rows in an audit DB
# they install through the first-write-wins `audit_db::init_globals`
# OnceLock, and g_admin already has a third installer (admin_oauth, via
# common::oauth_helpers), so merged they read whichever file won the race.
name = "admin_pat_bearer"
path = "tests/admin_pat_bearer.rs"
[[test]]
name = "admin_pat_reroll"
path = "tests/admin_pat_reroll.rs"
[[test]]
name = "g_audit"
path = "tests/g_audit.rs"
[[test]]
# Isolation exception (#925 T3): measures that a retention pass drops NO
# inbound audit row, a count over the whole process's audit traffic — and it
# installs the writer it counts through the first-write-wins
# `audit_db::init_globals` OnceLock that audit_middleware also races for. Its
# own header asks for a binary to itself.
name = "audit_retention_no_drop"
path = "tests/audit_retention_no_drop.rs"
[[test]]
name = "g_auth"
path = "tests/g_auth.rs"
[[test]]
name = "g_batch"
path = "tests/g_batch.rs"
[[test]]
name = "g_cli"
path = "tests/g_cli.rs"
[[test]]
name = "g_collection"
path = "tests/g_collection.rs"
[[test]]
name = "g_cron"
path = "tests/g_cron.rs"
[[test]]
name = "g_egress"
path = "tests/g_egress.rs"
[[test]]
# Isolation exception (#925 T3): asserts on audit rows in the DB it installs
# via the first-write-wins `audit_db::init_globals` OnceLock, which
# egress_config — which asserts on its own DB the same way — also races for
# inside g_egress.
name = "egress_http_fetch"
path = "tests/egress_http_fetch.rs"
[[test]]
name = "g_file"
path = "tests/g_file.rs"
[[test]]
name = "g_fts"
path = "tests/g_fts.rs"
[[test]]
name = "g_functions"
path = "tests/g_functions.rs"
[[test]]
name = "g_mcp"
path = "tests/g_mcp.rs"
[[test]]
name = "g_member"
path = "tests/g_member.rs"
[[test]]
name = "g_misc"
path = "tests/g_misc.rs"
[[test]]
name = "g_policy"
path = "tests/g_policy.rs"
[[test]]
name = "g_record"
path = "tests/g_record.rs"
[[test]]
name = "g_rooms"
path = "tests/g_rooms.rs"
[[test]]
name = "g_rpc"
path = "tests/g_rpc.rs"
[[test]]
# Isolation exception (#925 T3): asserts on audit rows in the DB it installs
# via the first-write-wins `audit_db::init_globals` OnceLock, which
# rpc_query_kind — which asserts on its own DB the same way — also races for
# inside g_rpc.
name = "rpc_v2_mutation"
path = "tests/rpc_v2_mutation.rs"
[[test]]
name = "g_schema"
path = "tests/g_schema.rs"
[[test]]
name = "g_storage"
path = "tests/g_storage.rs"
[[test]]
name = "g_tenant"
path = "tests/g_tenant.rs"
[[test]]
# Isolation exception (#925 T2): asserts on audit rows in the DB it installs
# via the first-write-wins `audit_db::init_globals` OnceLock, which
# tenant_oauth (via common::oauth_helpers) also races for inside g_tenant.
name = "tenant_quota_requests"
path = "tests/tenant_quota_requests.rs"
[[test]]
name = "g_user"
path = "tests/g_user.rs"
[[test]]
name = "g_vector"
path = "tests/g_vector.rs"
[[test]]
name = "g_webhook"
path = "tests/g_webhook.rs"
[[test]]
# Isolation exceptions (#925 spec §分組): these keep a binary to themselves
# because they mutate process-global state — seven call std::env::set_var /
# remove_var, and base_path_root drives the first-write-wins base-path
# OnceLock. They are not group harnesses; run one with
# `cargo test --test <name>`.
name = "admin_theme"
path = "tests/admin_theme.rs"
[[test]]
name = "base_path_root"
path = "tests/base_path_root.rs"
[[test]]
name = "cli_device_approval"
path = "tests/cli_device_approval.rs"
[[test]]
name = "config"
path = "tests/config.rs"
[[test]]
name = "deploy4_login_version"
path = "tests/deploy4_login_version.rs"
[[test]]
name = "fts_deadline"
path = "tests/fts_deadline.rs"
[[test]]
name = "query_executor"
path = "tests/query_executor.rs"
[[test]]
name = "webhook_concurrency"
path = "tests/webhook_concurrency.rs"
