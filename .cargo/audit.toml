# cargo-audit project config. Every ignore below MUST carry a justification
# and a removal condition — re-evaluate on each release.

[advisories]
ignore = [
    # rmcp 1.8.0 RUSTSEC-2026-0462 (GHSA-c9f9-cp8h-jcj5): unbounded response
    # body buffering in rmcp's Streamable HTTP *clients*; patched only in
    # rmcp >= 3.9.0. NOT COMPILED INTO drust (verified 2026-11-15): drust is
    # an MCP server only, and the enabled rmcp feature set is exactly
    # [base64, default, macros, server, server-side-http, tower,
    # transport-async-rw, transport-streamable-http-server,
    # transport-streamable-http-server-session, transport-worker, uuid]
    # (`cargo tree -p rmcp -e features --target all --depth 0`). The affected
    # code is `transport::streamable_http_client` (gated on
    # `transport-streamable-http-client`), its reqwest impl
    # `transport::common::reqwest::streamable_http_client` (gated on
    # `transport-streamable-http-client-reqwest`) and
    # `transport::common::unix_socket` (gated on
    # `transport-streamable-http-client-unix-socket`) — none of those
    # features, nor `client` / `__reqwest`, is enabled, and rmcp pulls no
    # reqwest/hyper into the graph. drust-cli (cli/) does not depend on rmcp
    # at all; its schema commands POST JSON-RPC to the per-tenant MCP path
    # with its own reqwest client; servers that retired that path answer 410.
    # RE-CHECK the feature list whenever rmcp's features change in Cargo.toml.
    # REMOVE when drust moves to rmcp >= 3.9 (the U stage of the MCP design).
    "RUSTSEC-2026-0462",
]
