name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # bindgen (forced by rusqlite's preupdate_hook feature, v1.46+) needs
      # libclang.so + clang builtin headers. Runner images usually ship clang,
      # but the dev lib is not guaranteed — install explicitly.
      - name: Install libclang (bindgen for libsqlite3-sys preupdate_hook)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # NEVER add --release here. Cargo.toml [profile.release] sets
      # LTO + codegen-units=1, making --release tests hang 40+ minutes.
      - name: cargo test --lib
        run: cargo test --lib

      - name: Install cargo-audit
        # Must be >= 0.22 (→ rustsec 0.33 → cvss ^2.2). The advisory DB is
        # fetched fresh each run and now ships CVSS 4.0 vectors (e.g.
        # RUSTSEC-2026-0124). The cvss crate only parses v4.0 from 2.1.0 on;
        # older cargo-audit (0.20/0.21) rejects the ENTIRE DB with
        # "unsupported CVSS version: 4.0" — even for advisories that don't
        # touch our deps. Do not downgrade this pin.
        run: cargo install cargo-audit --locked --version ^0.22

      - name: cargo audit
        run: cargo audit

      # The retention pass in deploy/drust-backup.sh is the only code in the repo
      # that DELETES production backup archives, and each archive carries every
      # tenant's service key and admin PAT in plaintext. It shipped its first
      # release with zero coverage behind a comment claiming a fixture test
      # existed; two real defects (an archive-counting daily tier, and a run
      # deleting its own output) went out under that claim. Pure bash + coreutils,
      # so it costs seconds.
      - name: backup retention fixtures
        run: bash deploy/tests/backup_retention_test.sh

      # The bundled Compose object store: no published store port, no default
      # credential, drust on its own bucket-scoped key, a GetObject-only public
      # policy, and a key generator that never rotates or prints a secret.
      # Static + fixture checks (its Docker part also runs when the runner has
      # docker compose).
      - name: compose object-store fixtures
        run: bash deploy/tests/compose_storage_test.sh

      # The Compose /public/* Caddy block serves tenant bytes from the admin
      # origin straight out of the object store. `caddy validate` accepts a
      # block that lost copy_response, the query strip or the bucket pin; this
      # pins each line, and @markup in lockstep with is_unsafe_inline_type.
      - name: compose /public route pins
        run: bash deploy/tests/compose_public_route_test.sh

      - name: janitor has no hardcoded _trash retention (#935)
        run: bash deploy/tests/janitor_no_hardcoded_trash_mtime_test.sh

  # The k3s chart's render test is not on this every-push gate while the chart
  # is on hold: it lives in helm-chart.yml and runs only when deploy/helm/** (or
  # that workflow) changes, or by hand. See that file for why, and for what it
  # demands on resume.
