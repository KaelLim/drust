name: Release CLI
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false
jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release once (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A single upstream job owns release creation so the matrix jobs
          # below can only UPLOAD — before this, all four platform jobs raced
          # softprops to CREATE the release and the losers died with
          # "already_exists" → "Too many retries", dropping that platform's
          # binary until a manual rerun (v1.58.6 macOS, v1.60.0 aarch64-linux).
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
                 --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin,      runner: macos-14 }
          - { target: x86_64-pc-windows-msvc,    runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p drust-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/drust"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          out="drust-${{ matrix.target }}"
          [[ "${{ matrix.target }}" == *windows* ]] && out="$out.exe"
          cp "$bin" "$out"
          sha256sum "$out" > "$out.sha256" || shasum -a 256 "$out" > "$out.sha256"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            drust-${{ matrix.target }}*
