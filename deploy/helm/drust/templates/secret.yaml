{{- if .Values.secrets.create }}
{{- if and .Values.storage.enabled .Values.storage.accessKey (eq .Values.storage.accessKey .Values.storage.rustfs.rootAccessKey) }}
{{- fail "storage.accessKey must be drust's own key, not storage.rustfs.rootAccessKey: with the root key drust could create buckets and change who may read \"public\"" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drust.labels" . | nindent 4 }}
type: Opaque
# data, not stringData: Helm applies server-side, and the API server records who owns a
# stringData key under stringData only, so a key a later chart version stops rendering
# would stay in the live Secret for good.
data:
  admin-username: {{ .Values.secrets.adminUser | toString | b64enc | quote }}
  admin-password: {{ required "secrets.adminPassword required (or set secrets.create=false)" .Values.secrets.adminPassword | toString | b64enc | quote }}
  {{- if .Values.storage.enabled }}
  # drust's own bucket-scoped key (rustfs-init creates it) and, apart from it, the RustFS
  # root key, which only the rustfs StatefulSet and rustfs-init read.
  s3-access-key: {{ required "storage.accessKey required when storage.enabled=true (drust's own key; openssl rand -hex 10)" .Values.storage.accessKey | toString | b64enc | quote }}
  s3-secret-key: {{ required "storage.secretKey required when storage.enabled=true (openssl rand -hex 20)" .Values.storage.secretKey | toString | b64enc | quote }}
  rustfs-root-access-key: {{ required "storage.rustfs.rootAccessKey required when storage.enabled=true (openssl rand -hex 10)" .Values.storage.rustfs.rootAccessKey | toString | b64enc | quote }}
  rustfs-root-secret-key: {{ required "storage.rustfs.rootSecretKey required when storage.enabled=true (openssl rand -hex 20)" .Values.storage.rustfs.rootSecretKey | toString | b64enc | quote }}
  {{- end }}
{{- end }}
