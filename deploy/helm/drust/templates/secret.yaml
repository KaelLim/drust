{{- if .Values.secrets.create }}
{{- if .Values.storage.enabled }}
{{- $ak := include "drust.key" .Values.storage.accessKey }}
{{- $root := dict "storage.rustfs.rootAccessKey" (include "drust.key" .Values.storage.rustfs.rootAccessKey) "storage.rustfs.rootSecretKey" (include "drust.key" .Values.storage.rustfs.rootSecretKey) }}
{{- if and $ak (eq $ak (get $root "storage.rustfs.rootAccessKey")) }}
{{- fail "storage.accessKey must be drust's own key, not storage.rustfs.rootAccessKey: with the root key drust could create buckets and change who may read \"public\"" }}
{{- end }}
{{- /* What init.sh would refuse only at hook time, after the timeout: checked here instead. */ -}}
{{- range $name, $v := $root }}
{{- if and $v (not (regexMatch "^[A-Za-z0-9]+$" $v)) }}
{{- fail (printf "%s: letters and digits only (rustfs-init puts the root key in an http://key:secret@host URL; openssl rand -hex)" $name) }}
{{- end }}
{{- if eq $v "rustfsadmin" }}
{{- fail (printf "%s must not be RustFS's published default rustfsadmin" $name) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drust.labels" . | nindent 4 }}
type: Opaque
# data, not stringData: the API server stores a stringData key as data, so neither Helm's
# client-side three-way patch nor a server-side apply ever removes it again; a key a later
# chart version stops rendering would stay in the live Secret for good.
data:
  admin-username: {{ .Values.secrets.adminUser | toString | b64enc | quote }}
  admin-password: {{ required "secrets.adminPassword required (or set secrets.create=false)" .Values.secrets.adminPassword | toString | b64enc | quote }}
  {{- if .Values.storage.enabled }}
  # drust's own bucket-scoped key (rustfs-init creates it) and, apart from it, the RustFS
  # root key, which only the rustfs StatefulSet and rustfs-init read. Trimmed: see drust.key.
  s3-access-key: {{ required "storage.accessKey required when storage.enabled=true (drust's own key; openssl rand -hex 10)" (include "drust.key" .Values.storage.accessKey) | b64enc | quote }}
  s3-secret-key: {{ required "storage.secretKey required when storage.enabled=true (openssl rand -hex 20)" (include "drust.key" .Values.storage.secretKey) | b64enc | quote }}
  rustfs-root-access-key: {{ required "storage.rustfs.rootAccessKey required when storage.enabled=true (openssl rand -hex 10)" (include "drust.key" .Values.storage.rustfs.rootAccessKey) | b64enc | quote }}
  rustfs-root-secret-key: {{ required "storage.rustfs.rootSecretKey required when storage.enabled=true (openssl rand -hex 20)" (include "drust.key" .Values.storage.rustfs.rootSecretKey) | b64enc | quote }}
  {{- end }}
{{- end }}
