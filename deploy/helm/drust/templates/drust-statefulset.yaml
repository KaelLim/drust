apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "drust.svcName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drust.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "drust.svcName" . }}
  replicas: 1                       # single-writer invariant — NEVER > 1
  selector:
    matchLabels:
      {{- include "drust.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "drust.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.scheduling.drust.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.drust.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.drust.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.drust.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if and .Values.backup.litestream.enabled .Values.backup.litestream.restore.enabled }}
      initContainers:
        - name: litestream-enumerate
          image: {{ .Values.backup.litestream.mcImage | default .Values.storage.minio.mcImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: HOME, value: /tmp }
            - { name: MC_CONFIG_DIR, value: /tmp/.mc }
            - { name: DEST_ENDPOINT, value: {{ .Values.backup.external.endpoint | quote }} }
            - { name: DEST_BUCKET, value: {{ .Values.backup.external.bucket | quote }} }
            - { name: REPLICA_PREFIX, value: {{ include "backup.prefix" . | quote }} }
            - name: AK
              valueFrom: { secretKeyRef: { name: {{ include "drust.backupSecretName" . }}, key: backup-s3-access-key } }
            - name: SK
              valueFrom: { secretKeyRef: { name: {{ include "drust.backupSecretName" . }}, key: backup-s3-secret-key } }
          command: ["/bin/sh", "/etc/litestream/enumerate.sh"]
          volumeMounts:
            - { name: data, mountPath: /data, readOnly: true }
            - { name: litestream-scratch, mountPath: /scratch }
            - { name: litestream-config, mountPath: /etc/litestream, readOnly: true }
            - { name: tmp, mountPath: /tmp }
        - name: litestream-restore
          image: {{ .Values.backup.litestream.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: REPLICA_PREFIX, value: {{ include "backup.prefix" . | quote }} }
            - { name: LITESTREAM_BUCKET, value: {{ .Values.backup.external.bucket | quote }} }
            - { name: LITESTREAM_ENDPOINT, value: {{ .Values.backup.external.endpoint | quote }} }
            - { name: LITESTREAM_REGION, value: {{ .Values.backup.external.region | quote }} }
            - { name: LITESTREAM_FORCE_PATH_STYLE, value: {{ .Values.backup.external.forcePathStyle | quote }} }
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ include "drust.backupSecretName" . }}, key: backup-s3-access-key } }
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "drust.backupSecretName" . }}, key: backup-s3-secret-key } }
          command: ["/bin/sh", "/etc/litestream/restore.sh"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: litestream-scratch, mountPath: /scratch }
            - { name: litestream-config, mountPath: /etc/litestream, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      {{- end }}
      containers:
        - name: drust
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 47826
          env:
            - { name: DRUST_DATA_DIR, value: /data }
            - { name: DRUST_LOG_DIR, value: /logs }
            - { name: DRUST_BIND, value: "0.0.0.0:47826" }
            - { name: DRUST_BASE_PATH, value: "" }
            - name: DRUST_INIT_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: {{ include "drust.secretName" . }}, key: admin-username } }
            - name: DRUST_INIT_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "drust.secretName" . }}, key: admin-password } }
            {{- if .Values.storage.enabled }}
            - name: GARAGE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "drust.secretName" . }}, key: s3-access-key } }
            - name: GARAGE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "drust.secretName" . }}, key: s3-secret-key } }
            - name: GARAGE_ADMIN_ENDPOINT
              valueFrom: { secretKeyRef: { name: {{ include "drust.secretName" . }}, key: admin-endpoint } }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "drust.secretName" . }}, key: admin-token } }
            {{- end }}
            {{- if .Values.hideVersion }}
            - { name: DRUST_HIDE_VERSION, value: "1" }
            {{- end }}
            - { name: RUST_LOG, value: {{ .Values.logLevel | quote }} }
            {{- if .Values.publicUrl }}
            - { name: DRUST_PUBLIC_URL, value: {{ .Values.publicUrl | quote }} }
            {{- end }}
            # File/object URLs (and the MCP upload hint) are built from this; without it
            # drust falls back to the systemd-deploy default http://localhost:8793, which
            # is dead for any real client. base_path is root (""), so no path suffix.
            - name: DRUST_PUBLIC_BASE_URL
              value: "{{ ternary "https" "http" .Values.ingress.tls.enabled }}://{{ .Values.ingress.host }}"
            {{- if not .Values.ingress.tls.enabled }}
            # No TLS => user agents drop the `Secure` session cookie (RFC 6265bis), so the
            # admin login POST 303s but the session never sticks. Evaluation / non-TLS only.
            - { name: DRUST_DEV_NO_SECURE_COOKIES, value: "1" }
            {{- end }}
            {{- if .Values.storage.enabled }}
            - { name: GARAGE_S3_ENDPOINT, value: {{ include "minio.endpoint" . | quote }} }
            # FIXED literal: drust's write path hardcodes bucket "public" (files.rs).
            - { name: GARAGE_PUBLIC_BUCKET, value: "public" }
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: 47826 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 47826 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.drust | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: logs, mountPath: /logs }
            - { name: tmp, mountPath: /tmp }
        {{- if .Values.maintenance.sidecar.enabled }}
        - name: maintenance
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: DRUST_DATA_DIR, value: /data }
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                # run at ~04:00 UTC: sleep the remaining seconds of the day past 04:00
                now=$(date -u +%s); mid=$(( (now/86400)*86400 )); tgt=$(( mid + 14400 ))
                [ "$now" -ge "$tgt" ] && tgt=$(( tgt + 86400 ))
                sleep $(( tgt - now ))
                echo "[maintenance] running drust_session_janitor"
                drust_session_janitor || echo "[maintenance] janitor exited non-zero"
                # NOTE (#935): _trash retention is handled IN-PROCESS by drust
                # (DRUST_TRASH_RETENTION_DAYS, default 7, 0 = keep forever). Do NOT
                # re-add a hardcoded time-based trash sweep here — it caps a longer
                # setting and defeats 0 (the v1.58.0 regression #935 removed).
              done
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
        {{- end }}
        {{- if .Values.backup.litestream.enabled }}
        - name: litestream
          image: {{ .Values.backup.litestream.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /data/tenants /data/.litestream/tenants
              exec litestream replicate -config /etc/litestream/litestream.yml
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ include "drust.backupSecretName" . }}, key: backup-s3-access-key } }
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "drust.backupSecretName" . }}, key: backup-s3-secret-key } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: litestream-config, mountPath: /etc/litestream, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- toYaml .Values.backup.litestream.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.backup.litestream.enabled }}
        - name: litestream-config
          configMap:
            name: {{ include "litestream.configName" . }}
            defaultMode: 0555
        {{- if .Values.backup.litestream.restore.enabled }}
        - name: litestream-scratch
          emptyDir: {}
        {{- end }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.data }}
    - metadata:
        name: logs
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.logs }}
