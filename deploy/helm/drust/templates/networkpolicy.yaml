{{- if .Values.networkPolicy.enabled }}
{{- if has "0.0.0.0/0" .Values.backup.external.destinationCIDRs }}
{{- fail "backup.external.destinationCIDRs must list your S3 provider's SPECIFIC ranges, not 0.0.0.0/0 — a scoped ipBlock cannot carry an 'except: clusterCIDRs', so 0.0.0.0/0 there is an unrestricted egress hole that also reaches co-tenant pods (and it would satisfy the fail-closed guard while defeating its purpose). Use the provider's published CIDRs, or set allowInternetEgress=true to accept broad egress explicitly." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-drust
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drust.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "drust.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - { protocol: TCP, port: 47826 }
  egress:
    # DNS — scoped to the cluster DNS namespace (not every namespace) so port-53
    # can't be a covert channel to a co-tenant pod.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.storage.enabled }}
    # drust -> own MinIO (same namespace)
    - to:
        - podSelector:
            matchLabels:
              {{- include "minio.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 9000 }
    {{- end }}
    {{- if .Values.networkPolicy.allowInternetEgress }}
    # Internet (OAuth / webhooks / http-fetch) — everything EXCEPT cluster CIDRs,
    # so other groups' pods/services stay unreachable. drust's PinnedPublicResolver
    # is the second SSRF layer.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.clusterCIDRs }}
              - {{ . }}
              {{- end }}
    {{- end }}
    {{- if .Values.backup.litestream.enabled }}
    {{- if and (not .Values.networkPolicy.allowInternetEgress) (not .Values.backup.external.destinationCIDRs) }}
    {{- fail "backup.litestream.enabled with networkPolicy.allowInternetEgress=false REQUIRES backup.external.destinationCIDRs (scope the backup egress to your S3 provider's IP ranges). Otherwise the Litestream sidecar — which shares the drust pod netns — would need a 0.0.0.0/0 egress hole, silently reopening the egress you closed on the pod that runs untrusted edge-function WASM (http-fetch) and outbound webhooks." }}
    {{- end }}
    # Litestream sidecar/init (same pod as drust) -> external backup S3. DECOUPLED from
    # allowInternetEgress: a group may close general egress yet still require offsite backup.
    # When general egress is OFF, destinationCIDRs is REQUIRED (fail above) so this never widens to a
    # cluster-wide egress hole on the drust pod; only external.port to those CIDRs is opened. (With
    # general egress ON the pod already has broad egress by the operator's choice, so this is moot.)
    - to:
        {{- if .Values.backup.external.destinationCIDRs }}
        {{- range .Values.backup.external.destinationCIDRs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
        {{- else }}
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.clusterCIDRs }}
              - {{ . }}
              {{- end }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.backup.external.port }} }
    {{- end }}
{{- if .Values.storage.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drust.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "minio.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "drust.selectorLabels" . | nindent 14 }}
        # minio-init hook Job needs to reach MinIO to create the public/private
        # buckets. It carries its OWN labels (not drust.selectorLabels — see the Job
        # template), so admit them explicitly or the bucket-init is black-holed.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio-init
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - { protocol: TCP, port: 9000 }
    {{- if .Values.publicFiles.enabled }}
    # public-file GETs arrive from the ingress controller via the /public path,
    # not from drust — allow that source too when public serving is on.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - { protocol: TCP, port: 9000 }
    {{- end }}
    {{- if .Values.backup.objectMirror.enabled }}
    # Hourly mc-mirror Job reads this group's MinIO:9000. It wears a dedicated label,
    # so admit it explicitly or it is black-holed.
    - from:
        - podSelector:
            matchLabels:
              {{- include "backupMirror.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 9000 }
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-minio-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drust.labels" . | nindent 4 }}
spec:
  # The minio-init hook Job wears its OWN labels (not drust's — so it stays out of the
  # drust Service endpoints), which also means no other NetworkPolicy selects it. Govern
  # it explicitly so it is not left with unrestricted egress: cluster DNS + own MinIO only.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio-init
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "minio.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 9000 }
{{- if .Values.backup.objectMirror.enabled }}
{{- if and (not .Values.networkPolicy.allowInternetEgress) (not .Values.backup.external.destinationCIDRs) }}
{{- fail "backup.objectMirror.enabled with networkPolicy.allowInternetEgress=false REQUIRES backup.external.destinationCIDRs (scope the mirror's backup egress). Otherwise the mirror pod silently gets a broad-internet egress rule even though you closed general egress — same fail-closed discipline as the Litestream sidecar." }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backup-mirror
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drust.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "backupMirror.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []                       # default-deny inbound
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "minio.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 9000 }
    {{- if .Values.backup.external.destinationCIDRs }}
    - to:
        {{- range .Values.backup.external.destinationCIDRs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.backup.external.port }} }
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.clusterCIDRs }}
              - {{ . }}
              {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.backup.external.port }} }
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
