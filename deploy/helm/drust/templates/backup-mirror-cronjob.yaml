{{- if and .Values.storage.enabled .Values.backup.objectMirror.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup-mirror
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drust.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.objectMirror.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.objectMirror.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.objectMirror.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backup.objectMirror.backoffLimit }}
      template:
        metadata:
          labels:
            # Dedicated label (NOT drust's or rustfs's selectorLabels) — same reason as rustfs-init:
            # keeps this probeless Job pod out of every Service's endpoints.
            {{- include "backupMirror.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: copy
              image: {{ .Values.s3ClientImage | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              env:
                - { name: HOME, value: /tmp }
                - { name: RCLONE_CONFIG, value: /dev/null }
                # A bucket-scoped key cannot CreateBucket; without this rclone tries it
                # before every upload and fails 403 (observed).
                - { name: RCLONE_S3_NO_CHECK_BUCKET, value: "true" }
                - { name: RCLONE_CONFIG_SRC_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_SRC_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_SRC_ENDPOINT, value: "http://{{ include "rustfs.svcName" . }}:9000" }
                - { name: RCLONE_CONFIG_SRC_FORCE_PATH_STYLE, value: "true" }
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID          # drust's own bucket-scoped key
                  valueFrom: { secretKeyRef: { name: {{ include "drust.secretName" . }}, key: s3-access-key } }
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: {{ include "drust.secretName" . }}, key: s3-secret-key } }
                {{- include "drust.rcloneBackupRemote" . | nindent 16 }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  dst="bk:{{ .Values.backup.external.bucket }}/{{ include "backup.prefix" . }}"
                  # First-connect retry: a new Job pod IP takes seconds to enter the CNI NP allow-set.
                  i=0
                  until rclone lsf src:public --max-depth 1 >/dev/null 2>&1; do
                    i=$((i+1)); [ "$i" -ge {{ .Values.backup.objectMirror.connectRetries }} ] && { echo "own object store unreachable"; exit 1; }
                    echo "waiting for own object store ($i)"; sleep {{ .Values.backup.objectMirror.connectRetrySleep }}
                  done
                  # Probe this group's PREFIX, not the bucket list (a prefix-scoped key cannot list buckets).
                  j=0
                  until rclone lsf "$dst/" --max-depth 1 >/dev/null 2>&1; do
                    j=$((j+1)); [ "$j" -ge {{ .Values.backup.objectMirror.connectRetries }} ] && { echo "backup S3 unreachable"; exit 1; }
                    echo "waiting for backup S3 ($j)"; sleep {{ .Values.backup.objectMirror.connectRetrySleep }}
                  done
                  # copy (never sync): an accidental source delete must not propagate into the backup.
                  # -M keeps Content-Type, Content-Disposition, Cache-Control and x-amz-meta-*: /public
                  # serves the first three straight from the store, so a restore without them changes
                  # what anonymous clients get.
                  rclone copy -M src:public  "$dst/objects/public"
                  rclone copy -M src:private "$dst/objects/private"
                  echo "upload-backup copy done"
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
