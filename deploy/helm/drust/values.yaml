# One helm release = one group = one namespace. See README.md.
# Default OFF: install with `helm install --create-namespace` instead. A release-owned
# Namespace couples `helm uninstall` to full data loss (namespace termination reaps every
# PVC). If you do set this true, the Namespace is annotated helm.sh/resource-policy=keep so
# uninstall cannot reap the PVCs — but --create-namespace is still the recommended path.
createNamespace: false

image:
  repository: ghcr.io/kaellim/drust
  # Empty = follow Chart.yaml's appVersion, which render_test.sh pins to
  # Cargo.toml's version. Leave it empty: a second hardcoded version here is
  # what shipped a nine-release-old image (1.49.4) while 1.58.1 was current,
  # because `helm install` reads THIS field, not appVersion. Set it only to pin
  # a specific build for a rollback or a canary.
  tag: ""
  pullPolicy: IfNotPresent

# External hostname for this group's drust. base_path is ALWAYS root ("").
ingress:
  host: drust.example.tw
  controller: traefik            # traefik | nginx
  # rmcp DNS-rebinding guard: upstream Host MUST be loopback form. Do NOT change.
  hostRewrite: "127.0.0.1:47826"
  className: ""                  # optional ingressClassName (nginx); empty = default
  tls:
    enabled: true
    issuer: letsencrypt          # cert-manager ClusterIssuer name (annotation)
    secretName: ""               # empty => "<release>-tls"

# DRUST_PUBLIC_URL — required for OAuth redirect round-trips; empty disables OAuth.
publicUrl: ""                    # e.g. https://drust.example.tw
logLevel: "info,drust=info"      # RUST_LOG
hideVersion: true                # DRUST_HIDE_VERSION

# v1.61 — webhook fan-out bounds. maxConcurrency caps deliveries in flight
# process-wide (a semaphore; latched at first delivery, so a change needs a pod
# restart — a StatefulSet env change rolls pods anyway). maxPerTenant caps
# registrations per tenant (read per create). NOFILE is not set here: pods
# inherit the container-runtime default, already above the 65536 floor.
webhook:
  maxConcurrency: 64             # DRUST_WEBHOOK_MAX_CONCURRENCY (deliveries in flight, process-wide)
  maxPerTenant: 32               # DRUST_WEBHOOK_MAX_PER_TENANT (registrations per tenant)
  maxPerTenantConcurrency: 8     # DRUST_WEBHOOK_MAX_PER_TENANT_CONCURRENCY (deliveries in flight, per tenant)

publicFiles:
  enabled: false                 # true => extra ingress path /public/* -> MinIO public bucket (anon read)

storage:
  enabled: true
  minio:
    image: "minio/minio:RELEASE.2024-10-13T13-34-11Z"
    mcImage: "minio/mc:RELEASE.2024-10-08T09-37-26Z"
    rootUser: drustkey
    rootPassword: ""             # set per-group (or via secrets.existingSecret)
    pvcSize: 20Gi
    # NOTE: bucket names are NOT configurable — drust's write path hardcodes
    # "public"/"private" (src/storage/files.rs). minio-init always creates exactly those.
  # Placeholders satisfy the mandatory GARAGE_ADMIN_* config (MinIO has no admin API; never dialed).
  adminEndpointPlaceholder: "http://127.0.0.1:1"
  adminTokenPlaceholder: "unused"

resources:
  drust:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }
  minio:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

persistence:
  storageClassName: ""           # empty => cluster default
  data: 10Gi                     # /data (SQLite + backups)
  logs: 1Gi                      # /logs (audit JSONL dir)

maintenance:
  sidecar:
    enabled: true                # daily drust_session_janitor loop (shares /data)

backup:
  # CSI VolumeSnapshot of the /data PVC. Empty class => backup CronJob NOT rendered.
  volumeSnapshotClassName: ""
  schedule: "0 3 * * *"          # UTC
  retain: 7                      # keep newest N snapshots (janitor in the same CronJob)
  kubectlImage: "bitnami/kubectl:1.30"

  # ── B1/B2 shared external offsite backup destination (single S3) ──
  # The CSI VolumeSnapshot keys above and these sub-trees are all opt-in / default-off.
  #
  # CROSS-GROUP ISOLATION (read before pointing multiple groups at one bucket): the replicated
  # meta.sqlite carries PLAINTEXT tokens (tokens.plaintext / _admin_tokens.plaintext). pathPrefix
  # (default = namespace) is only a SOFT boundary — if two groups target the same bucket with
  # bucket-wide credentials, group A can list/read group B's prefix = full data-plane + admin-PAT
  # compromise of the other group. Give each group EITHER a distinct bucket OR credentials whose
  # IAM policy is scoped to this group's prefix only.
  external:
    create: true                 # true => render <release>-backup-secret; false => use existingSecret
    existingSecret: ""           # pre-built Secret; key names MUST be backup-s3-access-key / backup-s3-secret-key
    accessKey: ""                # required when create=true AND any backup feature enabled
    secretKey: ""
    endpoint: ""                 # required when a backup feature is on, e.g. https://s3.us-west-2.amazonaws.com
    region: "us-east-1"
    bucket: ""                   # required when a backup feature is on
    forcePathStyle: true         # MinIO / most S3-compatible = true; AWS vhost = false
    port: 443                    # NP egress port to the backup S3; offsite MinIO usually 9000
    pathPrefix: ""               # per-group replica prefix; empty => .Release.Namespace (isolation key)
    destinationCIDRs: []         # optional NP tightening; empty => 0.0.0.0/0 except clusterCIDRs

  # ── B1: Litestream continuous DB replication (opt-in; independent of the CSI snapshot) ──
  litestream:
    enabled: false
    image: "litestream/litestream:0.5.15"   # floor >=0.5.13 (meta-dir); dir-mode + watch since 0.5.3
    mcImage: ""                  # enumerate init image; empty => storage.minio.mcImage
    watch: true                  # native watcher enrolls post-boot tenants without a restart — DO NOT disable
    tenantPattern: "*.sqlite"        # basename glob under /data/tenants (recursive:true walks <id>/ subdirs).
                                     # VERIFIED against the real litestream 0.5.15 binary: a slash-form like
                                     # "*/data.sqlite" or "**/data.sqlite" enrolls ZERO tenant DBs, so every
                                     # tenant's data.sqlite would be SILENTLY unbacked. Keep it a basename glob.
    syncInterval: "1s"
    snapshotInterval: "24h"
    retention: "720h"            # 30d; MUST exceed the audit DB monthly VACUUM cycle
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits:   { cpu: 250m, memory: 128Mi }
    restore:
      enabled: true              # enumerate + restore initContainers rebuild an empty /data from S3

  # ── B2: hourly mc-mirror of this group's MinIO objects -> external backup S3 ──
  # DR completeness (#933): enable objectMirror (or provide an external object
  # backup) for a RESTORABLE unit — the DB VolumeSnapshot/Litestream alone does
  # NOT capture uploaded objects, so a cold restore to an empty object store
  # leaves _system_files rows pointing at absent objects.
  objectMirror:
    enabled: false               # also needs storage.enabled
    schedule: "0 * * * *"        # hourly UTC
    image: ""                    # empty => storage.minio.mcImage
    connectRetries: 30           # first-connect retries (CNI NP allow-set propagation lag)
    connectRetrySleep: 2
    backoffLimit: 3
    successfulJobsHistoryLimit: 2
    failedJobsHistoryLimit: 2

networkPolicy:
  enabled: true
  # Namespace of the ingress controller. k3s Traefik = kube-system;
  # nginx-ingress usually = ingress-nginx (set it when controller: nginx).
  ingressControllerNamespace: kube-system
  # Source CIDRs for a hostNetwork ingress controller — the norm on bare metal,
  # where there is no LoadBalancer to hand out an external IP.
  #
  # A hostNetwork pod has no CNI pod IP, so there is no pod → namespace mapping
  # for the netpol implementation to resolve and `ingressControllerNamespace`
  # above can NEVER match it, however it is set. Every request is then refused
  # and the admin UI (and /public/* when publicFiles is on) returns 502.
  #
  # The source is NOT simply the node IP. For a cross-node connection the packet
  # leaves with the ingress node's flannel address, so both usually belong here:
  #   ingress node != drust node  → the ingress node's flannel.1 `src`
  #   ingress node == drust node  → the node IP
  # Find both with `ip route get <drust pod IP>` ON THE INGRESS NODE and read the
  # `src` field.
  #
  # Leave empty when the controller runs as an ordinary pod — the default costs
  # nothing and changes no rendered output. Use the narrowest prefixes that work
  # (/32 each); this opens the admin plane to those addresses, so 0.0.0.0/0 is
  # rejected outright, same discipline as backup.external.destinationCIDRs.
  hostNetworkIngressCIDRs: []
  dnsNamespace: kube-system      # namespace running cluster DNS (coredns)
  # WARNING: cross-group egress isolation depends on these matching the cluster's
  # REAL pod+service CIDRs. Defaults are k3s-only (10.42/16 pod, 10.43/16 svc). On
  # Calico/GKE/EKS/custom you MUST set the actual CIDRs or the `except` fails to
  # cover other groups' pod IPs (fail-open). The destination group's ingress policy
  # is the fail-closed backstop, but only if every group enables networkPolicy.
  clusterCIDRs:
    - 10.42.0.0/16               # k3s default pod CIDR
    - 10.43.0.0/16               # k3s default service CIDR
  allowInternetEgress: true      # OAuth / webhooks / http-fetch to public IPs

secrets:
  create: true                   # false => reference existingSecret for all sensitive env
  existingSecret: ""
  adminUser: admin               # DRUST_INIT_ADMIN_USERNAME (first boot only)
  adminPassword: ""              # DRUST_INIT_ADMIN_PASSWORD (first boot only)

extraEnv: []                     # arbitrary DRUST_*/GARAGE_* overrides: [{name, value}]

# ── B3: scheduling passthrough (empty => zero behavior change) ──
#
# `tolerations` is NOT just placement — on a multi-node cluster it is the single
# largest lever on drust's recovery time, and the default is bad for this shape.
#
# Kubernetes injects `node.kubernetes.io/not-ready` and `.../unreachable` with
# `tolerationSeconds: 300`. drust runs `replicas: 1` (SQLite, single writer), so
# there is no second pod to serve during those 300 seconds — it is pure downtime,
# and it dominates the budget. Measured on a real node failure (k3s stopped on
# the node hosting drust, Longhorn RWO volumes):
#
#   default 300s ................ ~396s total RTO   (300s of it just waiting)
#   tolerationSeconds: 60 ....... ~193s total RTO
#
# Same drill, one values change, roughly half the recovery time. Set it when the
# cluster has somewhere to fail over TO; on a single-node cluster it changes
# nothing, and on node-pinned storage (local-path) the pod cannot move anyway —
# see the README's storage prerequisites.
#
#   tolerations:
#     - key: node.kubernetes.io/not-ready
#       operator: Exists
#       effect: NoExecute
#       tolerationSeconds: 60
#     - key: node.kubernetes.io/unreachable
#       operator: Exists
#       effect: NoExecute
#       tolerationSeconds: 60
scheduling:
  drust:
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  minio:
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
