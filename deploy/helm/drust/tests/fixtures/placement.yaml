ingress: { host: pl.example.test, controller: traefik }
storage:
  enabled: true
  minio: { rootUser: u, rootPassword: p }
scheduling:
  drust:
    nodeSelector: { disktype: ssd }
    tolerations: [{ key: dedicated, operator: Equal, value: drust, effect: NoSchedule }]
    topologySpreadConstraints:
      - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app.kubernetes.io/name: drust } } }
  minio:
    nodeSelector: { disktype: ssd }
secrets: { create: true, adminPassword: pw }
