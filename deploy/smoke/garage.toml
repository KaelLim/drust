# Garage config for the local smoke stack (deploy/smoke/). No secrets here:
# the RPC secret and the admin token come from GARAGE_RPC_SECRET /
# GARAGE_ADMIN_TOKEN, which up.sh generates into deploy/smoke/.env.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.local"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.local"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
