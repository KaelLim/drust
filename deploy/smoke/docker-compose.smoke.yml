# Local smoke stack — an OVERRIDE layered on the real docker-compose.yml, so what
# runs is the Compose deployment target itself (same image, env, healthcheck,
# ulimits, stop_grace_period) plus an object store: RustFS from the repo's own
# docker-compose.storage.yml (default) or Garage (SMOKE_STORE=garage,
# docker-compose.smoke-garage.yml). This file is store-neutral.
#
# Do not run this file directly; use deploy/smoke/up.sh, which generates the
# secrets in deploy/smoke/.env and picks the store's files (compose-files.sh).
#
# Everything binds to host loopback on ports that do not collide with a drust
# or Garage already running on the host (47826, 47830-47832).
#
# DRUST_PUBLIC_BASE_URL and PUBLIC_OBJECTS_UPSTREAM are deliberately NOT set
# here: up.sh exports them, so the base file's own ${VAR:-default} lines are
# what runs. An override value would replace those lines and hide a regression.

name: drust-smoke

services:
  caddy:
    ports: !override
      - "127.0.0.1:${SMOKE_HTTP_PORT:-48080}:80"

  drust:
    ports: !override
      - "127.0.0.1:${SMOKE_DRUST_PORT:-48826}:47826"
    environment:
      DRUST_INIT_ADMIN_USERNAME: ${SMOKE_ADMIN_USERNAME:?run deploy/smoke/up.sh}
      DRUST_INIT_ADMIN_PASSWORD: ${SMOKE_ADMIN_PASSWORD:?run deploy/smoke/up.sh}
      # The base file hides the version header for the public image. A smoke run
      # needs it: it is the only honest proof of which build is answering.
      DRUST_HIDE_VERSION: !reset null
      DRUST_PUBLIC_URL: http://localhost:${SMOKE_HTTP_PORT:-48080}
      # The checks reach MCP only through the account-level endpoint, which needs it on.
      # SMOKE_DRUST_MCP=off deploy/smoke/up.sh starts the stack with it off (and records that
      # in .env), so that run-all.sh 00 50 checks the off state.
      DRUST_MCP: "${SMOKE_DRUST_MCP:-on}"
