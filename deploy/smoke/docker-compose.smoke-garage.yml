# Garage instead of RustFS (SMOKE_STORE=garage): what the bare-metal host runs.
# Layered after docker-compose.smoke.yml by deploy/smoke/compose-files.sh.
services:
  caddy:
    volumes:
      # deploy/compose.Caddyfile with its two STORE-SHAPE lines swapped for the
      # Garage forms, generated by up.sh: the documented operator edit, applied
      # mechanically so it stays tested. Same target path, so it replaces the base mount.
      - ./deploy/smoke/.generated/compose.garage.Caddyfile:/etc/caddy/Caddyfile:ro
  drust:
    environment:
      GARAGE_S3_ENDPOINT: http://garage:3900
      GARAGE_S3_ACCESS_KEY: ${SMOKE_S3_ACCESS_KEY:?run deploy/smoke/up.sh}
      GARAGE_S3_SECRET_KEY: ${SMOKE_S3_SECRET_KEY:?run deploy/smoke/up.sh}
      # No GARAGE_ADMIN_*: drust must boot on the S3 trio alone.
    depends_on:
      - garage

  # Same Garage line the bare-metal host runs. Single node, replication 1.
  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${SMOKE_GARAGE_RPC_SECRET:?run deploy/smoke/up.sh}
      GARAGE_ADMIN_TOKEN: ${SMOKE_GARAGE_ADMIN_TOKEN:?run deploy/smoke/up.sh}
    volumes:
      - ./deploy/smoke/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:${SMOKE_GARAGE_S3_PORT:-48900}:3900"    # S3 API
      - "127.0.0.1:${SMOKE_GARAGE_WEB_PORT:-48902}:3902"   # website (public bucket)
      - "127.0.0.1:${SMOKE_GARAGE_ADMIN_PORT:-48903}:3903" # admin API

volumes:
  garage-meta:
  garage-data:
