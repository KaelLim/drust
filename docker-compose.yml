# drust — single-command self-host.
#
#   docker compose up -d            # drust only (SQLite BaaS, no object storage)
#   docker compose --profile storage up -d   # drust + MinIO (S3 file storage)
#
# First boot creates the admin from DRUST_INIT_ADMIN_*. Change them, then open
# http://localhost/drust/login  (the bundled Caddy proxy fronts drust at
# /drust/*). drust + Caddy speak plain HTTP — terminate TLS at your edge proxy
# in production.

services:
  # Reverse proxy. drust is built to live behind a proxy mounted at /drust/*
  # (it hardcodes that prefix in its browser-facing URLs — forms, redirects,
  # cookie paths), so the admin UI is only usable THROUGH here, at
  # http://localhost/drust/login — not on drust's port directly.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/compose.Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - drust

  drust:
    build: .
    # Or pull a prebuilt image instead of building:
    # image: ghcr.io/kaellim/drust:latest
    restart: unless-stopped
    ports:
      # audit3 F2-RL-001 — bind the app port to host loopback ONLY. Caddy reaches
      # drust over the Docker network (service DNS), not this published port, so
      # this is purely for host-side debugging. Exposing it on all interfaces let
      # an attacker hit drust directly, bypassing Caddy's X-Forwarded-For
      # normalization and defeating the per-IP login/register rate-limit via XFF
      # rotation. Loopback-binding closes that direct-port reach.
      - "127.0.0.1:47826:47826"
    volumes:
      - drust-data:/data      # meta.sqlite + meta_logs.sqlite + tenants/ + backups/
      - drust-logs:/logs
    environment:
      # --- first-boot admin bootstrap (change these) ---
      DRUST_INIT_ADMIN_USERNAME: admin
      DRUST_INIT_ADMIN_PASSWORD: change-me-on-first-boot
      # audit3 INFO-1 — suppress the `x-drust-version` response header in the
      # distributed image so an unauthenticated client cannot fingerprint the
      # exact build for version-specific CVE targeting. (The in-app default
      # leaves it ON for deploy/live-smoke version checks; this opts the public
      # image out.) Set to empty/unset if you rely on the header.
      DRUST_HIDE_VERSION: "1"
      # --- public URL (required for OAuth redirect/callback links) ---
      # DRUST_PUBLIC_URL: https://drust.example.com
      # --- CORS allow-list for browser SPAs (exact origins or one '*' segment) ---
      # DRUST_CORS_ORIGINS: https://app.example.com,http://localhost:*
      # --- caller-controlled query deadline (ms); default 5000, 0 disables ---
      # Bounds raw /query, stored RPC, and the legacy raw-filter path so one
      # expensive recursive CTE cannot monopolise a runtime worker. Lower it on a
      # small-core host; raise it only if legitimate report queries are timing out.
      # DRUST_QUERY_DEADLINE_MS: "5000"
      # --- webhook fan-out bounds (task #932) ---
      # Max deliveries in flight process-wide (default 64). One bulk write into
      # a well-subscribed collection would otherwise open a task + socket per
      # (row × subscription). Queued deliveries are delayed, never dropped.
      # DRUST_WEBHOOK_MAX_CONCURRENCY: "64"
      # Max webhook registrations one tenant may hold (default 32); the 33rd
      # create fails with WEBHOOK_LIMIT_EXCEEDED.
      # DRUST_WEBHOOK_MAX_PER_TENANT: "32"
      # Max deliveries in flight PER TENANT (default 8) — a sub-cap UNDER
      # MAX_CONCURRENCY so one tenant's fan-out can't occupy the whole pool and
      # starve other tenants' webhooks (cross-tenant head-of-line blocking).
      # DRUST_WEBHOOK_MAX_PER_TENANT_CONCURRENCY: "8"
      # --- optional S3 object storage (uncomment with the `storage` profile) ---
      # GARAGE_S3_ENDPOINT:   http://minio:9000
      # GARAGE_S3_ACCESS_KEY: drustkey
      # GARAGE_S3_SECRET_KEY: drustsecret
      # NOTE: per-tenant bucket AUTO-provisioning needs Garage's admin API
      # (GARAGE_ADMIN_ENDPOINT + GARAGE_ADMIN_TOKEN). With MinIO/R2/S3, the
      # data path still works but you pre-create the buckets yourself.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:47826/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    # Compose defaults this to 10s, which is EXACTLY drust's own connection-drain
    # window (DRUST_SHUTDOWN_GRACE_SECS) — so Docker would SIGKILL at the very
    # moment drust stops waiting and starts flushing its audit buffer, losing it
    # on every single `compose down`. Must stay comfortably above that window.
    stop_grace_period: 30s
    # Webhook deliveries are semaphore-bounded (DRUST_WEBHOOK_MAX_CONCURRENCY,
    # default 64); this floor keeps FD headroom for SQLite handles + SSE/WS.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Optional S3-compatible object store for file features. Enable with:
  #   docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: drustkey
      MINIO_ROOT_PASSWORD: drustsecret
    volumes:
      - minio-data:/data

# BACKUP / DR: this compose file ships NO scheduled backup. For disaster
# recovery you must back up BOTH named volumes — `drust-data` (SQLite DBs +
# in-app snapshots under /data/backups) AND `minio-data` (uploaded objects).
# The in-app admin snapshot is DB-only and is NOT a complete DR unit; it also
# contains plaintext credentials — store it encrypted, off-host.
volumes:
  drust-data:
  drust-logs:
  minio-data:
